<style>
.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.fall{animation:fall 12s linear infinite}
@keyframes fall{from{transform:translate(0,0)}to{transform:translate(-160px,370px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.sun{animation:sun 6s ease-in-out infinite}@keyframes sun{0%,100%{transform:translateY(6px)}50%{transform:translateY(-4px)}}
.ray{transform-origin:600px 300px;animation:ray 40s linear infinite}@keyframes ray{to{transform:rotate(360deg)}}
.tz{animation:tz 2.4s ease-in-out infinite}@keyframes tz{0%,100%{opacity:.6}50%{opacity:1}}
.arrow{animation:ar 1.4s ease-in-out infinite}@keyframes ar{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
</style>
