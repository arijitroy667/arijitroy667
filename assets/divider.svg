<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="56" viewBox="0 0 1200 56">
<style>
.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.fall{animation:fall 12s linear infinite}
@keyframes fall{from{transform:translate(0,0)}to{transform:translate(-160px,90px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.run{animation:run 3.5s linear infinite}@keyframes run{from{transform:translateX(-300px)}to{transform:translateX(1300px)}}</style>
<defs><linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient>
<linearGradient id="r" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6FA8" stop-opacity="0"/><stop offset="1" stop-color="#FF6FA8"/></linearGradient></defs>
<rect x="0" y="27" width="1200" height="2" fill="url(#l)"/>
<rect x="0" y="25" width="220" height="6" rx="3" fill="url(#r)" class="run"/>
