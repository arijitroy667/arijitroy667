<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-label="Character status window for Arijit Roy">
<style>
.win{transform-origin:500px 300px;animation:open .9s cubic-bezier(.2,.9,.2,1) backwards}
@keyframes open{0%{transform:scaleY(.02) scaleX(.6);opacity:0}40%{transform:scaleY(.02) scaleX(1);opacity:1}100%{transform:scale(1)}}
.row{animation:row .5s ease backwards}
@keyframes row{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:left;animation:bar 1.2s cubic-bezier(.2,.9,.2,1) backwards}
@keyframes bar{from{transform:scaleX(0)}}
.shine{animation:shine 5s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-300px)}60%,100%{transform:translateX(1300px)}}
.corner{animation:cr 2s ease-in-out infinite}
@keyframes cr{0%,100%{opacity:.4}50%{opacity:1}}
.blink{animation:bl 1.2s steps(1) infinite}@keyframes bl{50%{opacity:0}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1A3A"/><stop offset="1" stop-color="#1B0F3F"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#FF6FA8"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="cl"><rect x="10" y="10" width="980" height="580" rx="16"/></clipPath>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#8B5CF6" stroke-opacity=".08"/></pattern>
</defs>
